version: '3'

services:
  h2server:
    image: ghcr.io/kwenoch/h2server:${H2SERVER_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    volumes:
      - ${H2SERVER_APP_ROOT:-/opt/persistent-storage/h2server/app}:/h2server
    networks:
      - h2server
    ports:
      - ${H2SERVER_APP_PORTS:-2000-2011}:2000-2011/tcp
      - ${H2SERVER_APP_PORTS:-2000-2011}:2000-2011/udp
    tty: true


networks:
  h2server:
    enable_ipv6: true
