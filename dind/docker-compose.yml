version: '3'

services:
  dind:
    image: docker:dind
    restart: unless-stopped
    privileged: true
    networks:
      - dind
    ports:
      - 2375:2375
    extra_hosts:
      - host.docker.internal:host-gateway
    command: dockerd -H tcp://0.0.0.0:2375 --tls=false

networks:
  dind:
    enable_ipv6: true
